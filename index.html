<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
        }

        nav {
            background: #1e40af;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            background: #1e293b;
            color: white;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Hosted using GitHub Pages</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero">
        <h2>Hello, World!</h2>
        <p>This is my first static website deployed using GitHub Pages.</p>
        <button onclick="alert('Website is working!')">
            Click Me
        </button>
    </section>

    <section id="about">
        <h2>About This Project</h2>
        <p>This website demonstrates free static website hosting.</p>
    </section>

    <section id="contact" style="padding: 30px;">
        <h2>Contact</h2>
        <p>Thank you for visiting!</p>
    </section>

    <footer>
        <p>&copy; 2026 My Website | Hosted on GitHub Pages</p>
    </footer>

</body>
</html>
